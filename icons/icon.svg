<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Unvix">
  <defs>
    <linearGradient id="u-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202023"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <linearGradient id="u-gold" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#c6933f"/>
    </linearGradient>
    <radialGradient id="u-halo" cx="0.42" cy="0.42" r="0.42">
      <stop offset="0" stop-color="#e6b25c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e6b25c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#u-bg)"/>
  <circle cx="54" cy="54" r="42" fill="url(#u-halo)"/>

  <!-- lens with the endpoint graph it uncovered -->
  <circle cx="54" cy="54" r="26" fill="#0d0d0e" stroke="url(#u-gold)" stroke-width="9"/>
  <g fill="none" stroke="url(#u-gold)" stroke-width="2.5">
    <path d="M44 43 L66 45 L54 66 Z" stroke-linejoin="round"/>
  </g>
  <g fill="#f0c674">
    <circle cx="44" cy="43" r="4.6"/>
    <circle cx="66" cy="45" r="4.6"/>
    <circle cx="54" cy="66" r="4.6"/>
  </g>

  <!-- handle + the spark that stands for "unveil" -->
  <line x1="71" y1="71" x2="105" y2="105" stroke="url(#u-gold)" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M99 18 L100.6 25.4 L108 27 L100.6 28.6 L99 36 L97.4 28.6 L90 27 L97.4 25.4 Z"
        fill="#f0c674" fill-opacity="0.85"/>

  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.4"/>
</svg>
